schema_version: '2.0'
concept_id: urn:tig:concept:decision
designations:
- label: decision
  language: en
  status: preferred
term: decision
aliases:
- decision
definition: An attributable determination by an authorized actor or mechanism that selects an outcome, state transition,
  permission, denial, requirement, or other governed effect under applicable policy and evidence.
notes:
- A decision should be distinguishable from the evidence considered and from the downstream effect produced by acting
  on the decision.
see_also:
- authority
- policy
- action
- risk-decision
sources:
- https://github.com/sankarshanmukhopadhyay/trust-systems-meta-model
- https://github.com/sankarshanmukhopadhyay/trust-infrastructure-schemas
- https://github.com/sankarshanmukhopadhyay/PolicyMesh
- https://github.com/sankarshanmukhopadhyay/open-national-digital-trust-framework
