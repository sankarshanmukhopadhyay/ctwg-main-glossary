term: trust-graph
aliases:
- trust graph
- trust graphs
definition: A data structure describing the trust relationship between two or more entities. A simple trust graph may be expressed
  as a trust list. More complex trust graphs can be recorded or registered in and queried from a trust registry. Trust graphs
  can also be expressed using trust chains and chained credentials. Trust graphs can enable verifiers and relying parties
  to make transitive trust decisions.
