term: sender-constrained-token
aliases:
- sender constrained token
definition: A token whose use is cryptographically constrained to a specific sender or key holder, reducing replay risk if the token is copied.
reader_note: This term is part of the v1.2.0 standards-linked refresh and is anchored to active implementation vocabulary.
