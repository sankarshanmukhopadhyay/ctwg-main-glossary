term: provenance
aliases:
- provenance
definition: Information about the origin, history, custody, transformation, or source lineage of data, content, credentials, or governed artifacts.
reader_note: This bridge term improves navigation across privacy, status, provenance, and assurance concepts.
implementation_relevance: Use this term where evidence needs to be carried across both reader-facing documentation and machine-verifiable assurance artifacts.
