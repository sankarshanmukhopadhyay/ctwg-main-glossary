term: pressure test
aliases:
- pressure-test
definition: A structured review that challenges a specification, policy, design, or system with adverse scenarios to identify risks, harms, control gaps, and weak assumptions.
simple_definition: A deliberate attempt to find where a design or specification could fail, cause harm, or rely on weak assumptions.
notes:
- Added in v1.5.0 following a cross-repository terminology review of active trust infrastructure, agent governance, assurance, and national trust framework projects.
