schema_version: '2.0'
concept_id: urn:tig:concept:accountability
designations:
- label: accountability
  language: en
  status: preferred
term: accountability
aliases:
- accountability
definition: The condition in which responsibility for a governed action, decision, control, or effect is attributable
  to an identified actor or authority that can be required to explain, justify, correct, or answer for it.
notes:
- 'Accountability requires more than provenance: it links attribution to an obligation to justify, correct, remediate,
  or otherwise answer for governed outcomes.'
