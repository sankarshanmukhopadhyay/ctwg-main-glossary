term: laws-of-identity
aliases:
- Laws of Identity
definition: A set of seven “laws” written by Kim Cameron, former Chief Identity Architect of Microsoft (1941-2021), to describe
  the dynamics that cause digital identity systems to succeed or fail in various contexts. His goal was to define the requirements
  for a unifying identity metasystem that can offer the Internet the identity layer it needs.
