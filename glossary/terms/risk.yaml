- glossary
- definition
sources:
- '[eSSIF-Lab](https://essif-lab.github.io/framework/docs/essifLab-glossary)'
mental_models: []
supporting_definitions:
- '[NIST-CSRC](https://csrc.nist.gov/glossary/term/risk): A measure of the extent to which an entity is threatened by a potential
  circumstance or event, and typically a function of: (i) the adverse impacts that would arise if the circumstance or event
  occurs; and (ii) the likelihood of occurrence.'
