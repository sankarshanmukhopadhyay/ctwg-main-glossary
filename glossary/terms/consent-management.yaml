mental_models: []
supporting_definitions:
- '[Wikipedia](https://en.wikipedia.org/wiki/Consent_management): Consent management is a system, process or set of policies
  for allowing consumers and patients to determine what health information they are willing to permit their various care providers
  to access. It enables patients and consumers to affirm their participation in e-health initiatives and to establish consent
  directives to determine who will have access to their protected health information (PHI), for what purpose and under what
  circumstances. Consent management supports the dynamic creation, management and enforcement of consumer, organizational
  and jurisdictional privacy policies.'
