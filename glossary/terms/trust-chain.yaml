reader_note: In OpenID Federation this concept is expressed through signed entity
  statements and trust anchors. In credential ecosystems it can also describe transitive
  credential or registry relationships.
implementation_relevance: Use this term when a verifier or relying party must validate
  more than one link of authority before accepting a credential, key, or participant.
