schema_version: '2.0'
concept_id: urn:tig:concept:assurance
designations:
- label: assurance
  language: en
  status: preferred
term: assurance
aliases:
- assurance
definition: A justified level of confidence that defined claims, controls, processes, artifacts, or system properties
  satisfy stated requirements within a specified scope and context.
notes:
- Assurance depends on explicit scope, criteria, evidence, and evaluation. It should not be inferred solely from
  successful technical validation.
