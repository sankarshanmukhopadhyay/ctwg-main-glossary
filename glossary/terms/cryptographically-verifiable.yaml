term: cryptographically-verifiable
aliases:
- cryptographically verifiable
- cryptographically verified
definition: A property of a data structure that has been digitally signed using a private key such that the digital signature
  can be verified using the public key. Verifiable data, verifiable messages, verifiable credentials, and verifiable data
  registries are all cryptographically verifiable. Cryptographic verifiability is a primary goal of the ToIP Technology Stack.
