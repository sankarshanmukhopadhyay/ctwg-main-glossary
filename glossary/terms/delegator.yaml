supporting_definitions:
- '[eSSIF-Lab](https://essif-lab.github.io/framework/docs/essifLab): the transferral of [ownership](https://essif-lab.github.io/framework/docs/terms/ownership)
  of one or more obligation of a [party](https://essif-lab.github.io/framework/docs/terms/party) (the [delegator](https://essif-lab.github.io/framework/docs/terms/delegate)),
  including the associated accountability, to another party (the [delegatee](https://essif-lab.github.io/framework/docs/terms/delegate)),
  which implies that the delegatee can realize such obligation as it sees fit.'
