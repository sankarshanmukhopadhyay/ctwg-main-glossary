reader_note: Use this term for the general governance role of verifiable credentials. Use verifiable-credential-data-model-2-0 when specifically referring to the W3C data model.
implementation_relevance: Implementers should distinguish the credential data model, securing format, transport protocol, holder binding, status mechanism, and presentation protocol.
