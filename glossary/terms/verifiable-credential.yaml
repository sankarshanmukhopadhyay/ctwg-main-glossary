term: verifiable-credential
aliases:
- verifiable credential
- verifiable credentials
- VC
- VCs
definition: A cryptographically secured credential whose authenticity and integrity can be verified, including credentials represented using the W3C Verifiable Credentials Data Model, ISO mdoc, or SD-JWT VC profiles depending on the ecosystem profile.
notes: []
