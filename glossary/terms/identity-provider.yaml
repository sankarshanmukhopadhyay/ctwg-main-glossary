definition: An identity provider (abbreviated IdP or IDP) is a system entity that creates, maintains, and manages identity
  information for principals and also provides authentication services to relying applications within a federation or distributed
  network.
notes:
- The term “identity provider” is used in federated identity systems because it is a required component of their architecture.
  By contrast, decentralized identity and self-sovereign identity systems do not use the term because they are architected
  to enable entities to create and control their own digital identities without the need to depend on an external provider.
