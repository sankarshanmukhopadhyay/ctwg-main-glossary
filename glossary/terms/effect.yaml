schema_version: '2.0'
concept_id: urn:tig:concept:effect
designations:
- label: effect
  language: en
  status: preferred
term: effect
aliases:
- effect
definition: A material state change, permission, restriction, publication, transaction, invocation, or other externally
  meaningful consequence produced or authorized by a decision or governed action.
notes:
- 'An effect is distinct from a decision: a decision may authorize or require an effect, while execution determines
  whether that effect actually occurs.'
see_also:
- action
- authorization
- decision
- policy
sources:
- https://github.com/sankarshanmukhopadhyay/trust-systems-meta-model
- https://github.com/sankarshanmukhopadhyay/governance-authority-assurance-metamodel
- https://github.com/sankarshanmukhopadhyay/open-national-digital-trust-framework
