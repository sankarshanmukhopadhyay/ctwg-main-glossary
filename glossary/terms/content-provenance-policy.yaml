  normative: false
reader_note: This term was added following a cross-repository terminology review of TSMM, TIS, TGA, and the DTG ZKP Task Force
  workspace.
implementation_relevance: Use this term to keep runtime governance, delegation, evidence, and privacy semantics consistent
  across interoperating trust infrastructure repositories.
