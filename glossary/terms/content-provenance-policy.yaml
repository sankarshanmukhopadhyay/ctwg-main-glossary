term: content provenance policy
aliases:
- content provenance policy
- content-provenance-policy
definition: A governance policy that specifies what provenance, integrity, sanitization, redaction, and evidence conditions
  must be satisfied before content may be acted upon, stored, or forwarded.
notes:
- This definition is normalized for cross-repository use and should be applied together with the governing profile or specification
  that supplies domain-specific constraints.
