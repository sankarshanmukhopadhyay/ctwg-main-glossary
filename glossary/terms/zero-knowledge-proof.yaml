supporting_definitions:
- 'Also known as: zero-knowledge protocol, [[ref: ZKP]].'
- '[Ethereum:](https://ethereum.org/en/zero-knowledge-proofs/) A zero-knowledge proof is a way of proving the validity of
  a statement without revealing the statement itself.'
- '[Wikipedia](https://en.wikipedia.org/wiki/Zero-knowledge_proof): a method by which one [[ref: party]] (the prover) can
  prove to another party (the verifier) that a given statement is true, while avoiding conveying to the [[ref: verifier]]
  any information beyond the mere fact of the statement''s truth.'
