supporting_definitions:
- '[Wikipedia](https://en.wikipedia.org/wiki/Role-based_access_control): In computer systems security, role-based access control
  (RBAC) or role-based security is an approach to restricting system access to authorized users, and to implementing [mandatory
  access control](https://en.wikipedia.org/wiki/Mandatory_access_control) (MAC) or [discretionary access control](https://en.wikipedia.org/wiki/Discretionary_access_control)
  (DAC).'
