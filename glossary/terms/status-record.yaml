definition: An inspectable record that represents the validity, suspension, revocation, or lifecycle status of a credential,
  authorization, registration, or governed object.
reader_note: This bridge term improves navigation across privacy, status, provenance, and assurance concepts.
implementation_relevance: Use this term where evidence needs to be carried across both reader-facing documentation and machine-verifiable
