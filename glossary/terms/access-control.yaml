supporting_definitions:
- '[Wikipedia](https://en.wikipedia.org/wiki/Access_control): In [physical security](https://en.wikipedia.org/wiki/Physical_security)
  and [information security](https://en.wikipedia.org/wiki/Information_security), access control (AC) is the selective restriction
  of access to a place or other resource, while access management describes the process. The act of accessing may mean consuming,
  entering, or using. Permission to access a resource is called [[ref: authorization]].'
