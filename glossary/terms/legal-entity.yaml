term: legal-entity
aliases:
- legal entity
- legal entities
definition: An entity that is not a natural person but is recognized as having legal rights and responsibilities. Examples
  include corporations, partnerships, sole proprietorships, non-profit organizations, associations, and governments. (In some
  cases even natural systems such as rivers are treated as legal entities.)
