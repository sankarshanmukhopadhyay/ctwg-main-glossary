term: policy enforcement
aliases:
- policy-enforcement
definition: The application of an applicable policy at a decision or execution point so that required, allowed, deferred,
  or prohibited outcomes are actually carried out.
simple_definition: Making sure a policy changes what the system actually allows or blocks.
notes:
- Added in v1.5.0 following a cross-repository terminology review of active trust infrastructure, agent governance, assurance,
  and national trust framework projects.
