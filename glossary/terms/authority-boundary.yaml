term: authority boundary
aliases:
- authority boundary
- authority-boundary
definition: A machine- or human-readable constraint that identifies where authority begins and ends, including the permitted actor, scope, action, target, conditions, and lifecycle state.
notes:
- This definition is normalized for cross-repository use and should be applied together with the governing profile or specification that supplies domain-specific constraints.
see_also:
- authority
- scope
- trust-boundary
sources:
