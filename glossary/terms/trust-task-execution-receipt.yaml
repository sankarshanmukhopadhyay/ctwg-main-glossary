term: Trust Task Execution Receipt
aliases:
- trust task execution receipt
- trust-task-execution-receipt
definition: A structured receipt that records how a trust-relevant task was authorized,
  executed, evidenced, and completed or terminated.
notes:
- This definition is normalized for cross-repository use and should be applied together
  with the governing profile or specification that supplies domain-specific constraints.
see_also:
- trust-task
- authority
- policy
sources:
- title: TIS repository terminology and model documentation
  publisher: GitHub
  url: https://github.com/sankarshanmukhopadhyay/trust-infrastructure-schemas
  normative: false
reader_note: This term was added following a cross-repository terminology review of
  TSMM, TIS, TGA, and the DTG ZKP Task Force workspace.
implementation_relevance: Use this term to keep runtime governance, delegation, evidence,
  and privacy semantics consistent across interoperating trust infrastructure repositories.
