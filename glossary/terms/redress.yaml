term: redress
aliases: []
definition: A governed path through which an affected party can challenge an outcome, seek correction or remedy, and obtain an accountable response.
simple_definition: A way for someone affected by a decision to challenge it and seek a correction or remedy.
notes:
- Added in v1.5.0 following a cross-repository terminology review of active trust infrastructure, agent governance, assurance, and national trust framework projects.
see_also:
- governance
- decision receipt
sources:
