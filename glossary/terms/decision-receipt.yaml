term: decision receipt
aliases:
- decision receipt
- decision-receipt
definition: A structured, integrity-protected record of a trust or governance decision, including the decision context, authority,
  policy, evidence, outcome, obligations, and traceability data.
notes:
- This definition is normalized for cross-repository use and should be applied together with the governing profile or specification
  that supplies domain-specific constraints.
