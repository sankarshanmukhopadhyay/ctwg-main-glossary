term: authority control plane
aliases:
- authority-control-plane
definition: The set of governance and runtime mechanisms that determine who may act, under whose authority, within what scope, and with what lifecycle and enforcement conditions.
simple_definition: The part of a system that decides who is allowed to do what, under whose authority, and under which limits.
notes:
- Added in v1.5.0 following a cross-repository terminology review of active trust infrastructure, agent governance, assurance, and national trust framework projects.
