mental_models: []
supporting_definitions:
- '[Wikipedia](https://en.wikipedia.org/wiki/Host_\(network\)): A network host is a [computer](https://en.wikipedia.org/wiki/Computer)
  or other device connected to a [computer network](https://en.wikipedia.org/wiki/Computer_network). A host may work as a
  [server](https://en.wikipedia.org/wiki/Server_\(computing\)) offering information resources, services, and applications
  to users or other hosts on the network. Hosts are assigned at least one [network address](https://en.wikipedia.org/wiki/Network_address).
  A computer participating in networks that use the [Internet protocol suite](https://en.wikipedia.org/wiki/Internet_protocol_suite)
  may also be called an IP host. Specifically, computers participating in the [Internet](https://en.wikipedia.org/wiki/Internet)
  are called Internet hosts. Internet hosts and other IP hosts have one or more [IP addresses](https://en.wikipedia.org/wiki/IP_address)
  assigned to their network interfaces.'
