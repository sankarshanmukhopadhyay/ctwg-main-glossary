definition: In the context of cybersecurity, impersonation is when an attacker pretends to be another person in order to commit
  fraud or some other digital crime.
notes: []
see_also:
- glossary
- definition
sources:
- 'ToIP CTWG maintained glossary source: `spec/terms-definitions/impersonation.md`'
mental_models: []
supporting_definitions:
- '[Wikipedia](https://en.wikipedia.org/wiki/Impersonator): An impersonator is someone who imitates or copies the behavior
  or actions of another. As part of a [criminal act](https://en.wikipedia.org/wiki/Crime) such as [identity theft](https://en.wikipedia.org/wiki/Identity_theft),
  the criminal is trying to assume the identity of another, in order to commit [fraud](https://en.wikipedia.org/wiki/Fraud),
  such as accessing confidential information, or to gain property not belonging to them. Also known as [social engineering](https://en.wikipedia.org/wiki/Social_engineering_\(security\))
  and [impostors](https://en.wikipedia.org/wiki/Impostor).'
