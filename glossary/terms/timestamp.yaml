  status: alternative
term: timestamp
aliases:
- timestamp
- timestamps
definition: A token or packet of information that is used to provide assurance of timeliness; the timestamp contains timestamped
  data, including a time, and a signature generated by a trusted timestamp authority (TTA).
notes: []
see_also:
