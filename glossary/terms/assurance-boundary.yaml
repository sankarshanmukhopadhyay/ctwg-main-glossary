term: assurance boundary
aliases:
- assurance-boundary
definition: The explicit limit of what an assurance claim, test result, evidence set, or implementation can reasonably support.
simple_definition: The line that says what an assurance result does and does not prove.
notes:
- Added in v1.5.0 following a cross-repository terminology review of active trust infrastructure, agent governance, assurance, and national trust framework projects.
