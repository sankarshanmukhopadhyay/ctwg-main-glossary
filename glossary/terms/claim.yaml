term: claim
aliases:
- claim
- claims
- claimed
- claiming
definition: An assertion about a subject, typically expressed as an attribute or property of the subject. It is called a “claim”
  because the assertion is always made by some party, called the issuer of the claim, and the validity of the claim must be
  judged by the verifier.
notes:
- If the issuer of the claim is also the subject of the claim, the claim is self-asserted.
