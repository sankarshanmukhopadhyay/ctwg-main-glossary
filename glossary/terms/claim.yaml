mental_models: []
supporting_definitions:
- '[W3C VC](https://www.w3.org/TR/vc-data-model/#terminology): An assertion made about a [subject](https://www.w3.org/TR/vc-data-model/#dfn-subjects).'
- '[Wikipedia](https://en.wikipedia.org/wiki/Claims-based_identity): A claim is a statement that one subject, such as a person
  or organization, makes about itself or another subject. For example, the statement can be about a name, group, buying preference,
  ethnicity, privilege, association or capability.'
